name: Phase C order lifecycle hardening

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Patch lifecycle invariants
        shell: python
        run: |
          from pathlib import Path

          # Pickup: aggregate duplicate item IDs before checking availability.
          p = Path('artifacts/api-server/src/routes/pickups.ts')
          s = p.read_text()
          old = '''        // Validate all quantities before making any changes
        for (const itemReq of data.items) {
          const oi = allOrderItems.find(i => i.id === itemReq.orderItemId);
          if (!oi) {
            return { itemNotFound: itemReq.orderItemId } as const;
          }
          const remaining = oi.quantity - oi.quantityPickedUp;
          if (itemReq.quantity > remaining) {
            return { overPickup: { name: oi.name, remaining } } as const;
          }
        }

        // All validations passed — apply updates within the transaction
        const updatedPickedUp = new Map(allOrderItems.map(oi => [oi.id, oi.quantityPickedUp]));
        for (const itemReq of data.items) {
          const oi = allOrderItems.find(i => i.id === itemReq.orderItemId)!;
          const newQty = oi.quantityPickedUp + itemReq.quantity;
          await tx.update(orderItems).set({ quantityPickedUp: newQty }).where(eq(orderItems.id, oi.id));
          updatedPickedUp.set(oi.id, newQty);
        }
'''
          new = '''        // Aggregate duplicate item IDs before validation. Otherwise a request such as
        // [{orderItemId: 7, quantity: 4}, {orderItemId: 7, quantity: 4}] could pass
        // validation against 5 remaining units and then record 8 picked up.
        const requestedByItem = new Map<number, number>();
        for (const itemReq of data.items) {
          requestedByItem.set(itemReq.orderItemId, (requestedByItem.get(itemReq.orderItemId) ?? 0) + itemReq.quantity);
        }

        // Validate the aggregated quantity before making any changes.
        for (const [itemId, requestedQuantity] of requestedByItem) {
          const oi = allOrderItems.find(i => i.id === itemId);
          if (!oi) {
            return { itemNotFound: itemId } as const;
          }
          const remaining = oi.quantity - oi.quantityPickedUp;
          if (requestedQuantity > remaining) {
            return { overPickup: { name: oi.name, remaining } } as const;
          }
        }

        // Apply each item exactly once inside the transaction.
        const updatedPickedUp = new Map(allOrderItems.map(oi => [oi.id, oi.quantityPickedUp]));
        for (const [itemId, requestedQuantity] of requestedByItem) {
          const oi = allOrderItems.find(i => i.id === itemId)!;
          const newQty = oi.quantityPickedUp + requestedQuantity;
          await tx.update(orderItems).set({ quantityPickedUp: newQty }).where(eq(orderItems.id, oi.id));
          updatedPickedUp.set(oi.id, newQty);
        }
'''
          if old not in s: raise SystemExit('pickup validation block not found')
          s = s.replace(old, new, 1)
          old = '''        itemPickupsJson = data.items.map(req => {
          const oi = allOrderItems.find(i => i.id === req.orderItemId)!;
          return { orderItemId: req.orderItemId, quantity: req.quantity, name: oi.name };
        });
'''
          new = '''        itemPickupsJson = Array.from(requestedByItem.entries()).map(([orderItemId, quantity]) => {
          const oi = allOrderItems.find(i => i.id === orderItemId)!;
          return { orderItemId, quantity, name: oi.name };
        });
'''
          if old not in s: raise SystemExit('pickup JSON block not found')
          p.write_text(s.replace(old, new, 1))

          # Payment deletion: lock the order and recalculate in the same transaction.
          p = Path('artifacts/api-server/src/routes/orders.ts')
          s = p.read_text()
          start = s.index('ordersRouter.delete("/:id/payments/:paymentId"')
          end = s.index('\nordersRouter.', start + 20)
          old = s[start:end]
          new = '''ordersRouter.delete("/:id/payments/:paymentId", checkPermission("delete:payments"), idempotencyMiddleware, async (req: AuthRequest, res) => {
  try {
    const laundryId = req.auth!.laundryId;
    const workerBranchId = req.auth!.branchId;
    const orderId = parseInt(req.params.id);
    const paymentId = parseInt(req.params.paymentId);
    const auth = req.auth!;

    const result = await db.transaction(async (tx) => {
      const branchClause = workerBranchId ? sql` AND branch_id = ${workerBranchId}` : sql``;
      const locked = await tx.execute(sql`SELECT id, order_id, price, extra_charge, discount
        FROM orders WHERE id = ${orderId} AND laundry_id = ${laundryId}${branchClause} FOR UPDATE`);
      const order = (locked as any).rows?.[0];
      if (!order) return { orderNotFound: true } as const;

      const [existing] = await tx.select().from(paymentRecords)
        .where(and(eq(paymentRecords.id, paymentId), eq(paymentRecords.orderId, order.id)));
      if (!existing || existing.deletedAt) return { paymentNotFound: true } as const;

      await tx.update(paymentRecords).set({
        deletedAt: new Date(),
        deletedById: auth.type === "owner" ? (auth.ownerId ?? null) : (auth.workerId ?? null),
        deletedByType: auth.type,
        deletedByName: auth.name ?? auth.email ?? "unknown",
      }).where(eq(paymentRecords.id, paymentId));

      const remaining = await tx.select().from(paymentRecords)
        .where(and(eq(paymentRecords.orderId, order.id), isNull(paymentRecords.deletedAt)));
      const newAmountPaid = remaining.reduce((sum, p) => sum + parseFloat(p.amount || "0"), 0);
      const totalDue = parseFloat(order.price || "0") + parseFloat(order.extra_charge || "0") - parseFloat(order.discount || "0");
      const newPaymentStatus = totalDue <= 0 || newAmountPaid >= totalDue ? "paid" : newAmountPaid > 0 ? "partial" : "unpaid";

      await tx.update(orders).set({ amountPaid: newAmountPaid.toString(), paymentStatus: newPaymentStatus, updatedAt: new Date() })
        .where(eq(orders.id, order.id));
      return { orderId: order.id as number, orderRef: order.order_id as string, newAmountPaid, newPaymentStatus };
    });

    if ("orderNotFound" in result) return res.status(404).json({ error: "Order not found" });
    if ("paymentNotFound" in result) return res.status(404).json({ error: "Payment not found" });

    logAction({ auth: req.auth!, laundryId, action: "payment_deleted", orderId: result.orderId,
      metadata: { paymentId, orderId: result.orderRef, newAmountPaid: result.newAmountPaid, paymentStatus: result.newPaymentStatus } }).catch(() => {});
    res.status(204).send();
  } catch (err: any) {
    console.error("[payment delete] err:", err?.message, err?.code);
    res.status(500).json({ error: "Failed to delete payment" });
  }
});
'''
          p.write_text(s[:start] + new + s[end:])

      - name: Install and build
        run: pnpm install --frozen-lockfile && pnpm run build
      - name: Commit source fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/routes/pickups.ts artifacts/api-server/src/routes/orders.ts
          git diff --cached --quiet || git commit -m 'fix: harden pickup aggregation and payment deletion'
          git push
