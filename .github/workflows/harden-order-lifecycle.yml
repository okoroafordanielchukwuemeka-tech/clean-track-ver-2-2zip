name: Harden order lifecycle

on:
  workflow_dispatch:

jobs:
  harden:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Apply Phase A and B hardening
        shell: python
        run: |
          from pathlib import Path
          p = Path('artifacts/api-server/src/routes/orders.ts')
          s = p.read_text()

          old = '''  discount: z.number().optional(),
  discountReason: z.string().optional(),
});'''
          new = '''  discount: z.number().min(0).optional(),
  discountReason: z.string().optional(),
  branchId: z.number().int().positive().optional(),
});'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''const workerOrderUpdateSchema = z.object({
  status: z.enum(["pending", "processing", "ready", "partial_pickup", "completed", "cancelled"]).optional(),
  paymentStatus: z.enum(["unpaid", "partial", "paid"]).optional(),
  verifiedShirts: z.number().int().optional(),
  verifiedTrousers: z.number().int().optional(),'''
          new = '''const workerOrderUpdateSchema = z.object({
  status: z.enum(["pending", "processing", "ready", "partial_pickup", "completed", "cancelled"]).optional(),
  verifiedShirts: z.number().int().min(0).optional(),
  verifiedTrousers: z.number().int().min(0).optional(),'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''const ownerOrderUpdateSchema = workerOrderUpdateSchema.extend({
  price: z.number().optional(),
  extraCharge: z.number().optional(),
  discount: z.number().optional(),
});'''
          new = '''const ownerOrderUpdateSchema = workerOrderUpdateSchema.extend({
  price: z.number().min(0).optional(),
  extraCharge: z.number().min(0).optional(),
  discount: z.number().min(0).optional(),
});'''
          assert old in s
          s = s.replace(old, new, 1)

          start = s.index('    let customerId: number | null = data.customerId ?? null;')
          end = s.index('    const itemSummary = insertedItems.length > 0', start)
          replacement = '''    const requestedBranchId = data.branchId;
    const workerBranchId = req.auth!.branchId ?? null;
    const orderBranchId = workerBranchId ?? requestedBranchId;

    // Tenant/branch boundary: a worker is permanently scoped to their branch;
    // an owner may select any branch belonging to the same laundry.
    if (workerBranchId && requestedBranchId !== undefined && requestedBranchId !== workerBranchId) {
      return res.status(403).json({ error: "Workers can only create orders in their assigned branch" });
    }
    if (orderBranchId !== undefined) {
      const [ownedBranch] = await db.select({ id: branches.id }).from(branches)
        .where(and(eq(branches.id, orderBranchId), eq(branches.laundryId, laundryId)));
      if (!ownedBranch) return res.status(403).json({ error: "Branch not found" });
    }

    const sla = await getLaundrySla(laundryId);
    const createdAt = new Date();
    const processingDueAt = computeProcessingDueAt(createdAt, data.serviceType, sla);

    // The complete order creation unit is one transaction. Customer creation/
    // update, service validation, order, items and price adjustments either all
    // commit together or all roll back. This prevents orphan/incomplete orders.
    const result = await db.transaction(async (tx) => {
      let customerId: number | null = data.customerId ?? null;
      const phoneNorm = data.phone.trim();

      if (!customerId) {
        const [existingCustomer] = await tx.select().from(customers)
          .where(and(eq(customers.laundryId, laundryId), eq(customers.phone, phoneNorm)));

        if (existingCustomer) {
          customerId = existingCustomer.id;
          await tx.update(customers).set({ lastActivityAt: new Date() }).where(eq(customers.id, existingCustomer.id));
        } else {
          const [newCustomer] = await tx.insert(customers).values({
            laundryId,
            fullName: data.customerName,
            phone: phoneNorm,
            address: data.address,
          }).returning();
          customerId = newCustomer.id;
        }
      } else {
        const [ownedCustomer] = await tx.select().from(customers)
          .where(and(eq(customers.id, customerId), eq(customers.laundryId, laundryId)));
        if (!ownedCustomer) throw new Error("CUSTOMER_NOT_FOUND");
        await tx.update(customers).set({ lastActivityAt: new Date() }).where(eq(customers.id, customerId));
      }

      let computedPrice = data.price;
      let insertedItems: typeof orderItems.$inferSelect[] = [];
      let resolvedItems: Array<{ serviceId: number; name: string; quantity: number; unitPrice: number; lineTotal: number }> = [];

      if (data.items && data.items.length > 0) {
        const activeServices = await tx.select().from(services)
          .where(and(eq(services.laundryId, laundryId), eq(services.isActive, true)));
        const serviceMap = new Map(activeServices.map(s => [s.id, s]));
        for (const item of data.items) {
          const svc = serviceMap.get(item.serviceId);
          if (!svc) throw new Error(`SERVICE_NOT_FOUND:${item.serviceId}`);
          const priceField = data.serviceType === "express" ? svc.expressPrice
            : data.serviceType === "premium" ? svc.premiumPrice
            : svc.standardPrice;
          const unitPrice = parseFloat(priceField ?? svc.standardPrice);
          resolvedItems.push({ serviceId: svc.id, name: svc.name, quantity: item.quantity, unitPrice, lineTotal: item.quantity * unitPrice });
        }
        computedPrice = resolvedItems.reduce((sum, i) => sum + i.lineTotal, 0);
      }

      const totalDue = (computedPrice ?? 0) + (data.extraCharge ?? 0) - (data.discount ?? 0);
      if (totalDue < 0) throw new Error("INVALID_ORDER_TOTAL");

      const placeholder = `GEN-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      const [inserted] = await tx.insert(orders).values({
        laundryId,
        branchId: orderBranchId,
        customerId,
        orderId: placeholder,
        customerName: data.customerName,
        phone: phoneNorm,
        address: data.address,
        serviceType: data.serviceType,
        shirts: data.shirts ?? 0,
        trousers: data.trousers ?? 0,
        additionalNotes: data.additionalNotes,
        price: computedPrice?.toString(),
        extraCharge: data.extraCharge?.toString(),
        discount: data.discount?.toString(),
        processingDueAt,
      }).returning();

      const finalOrderId = await generateOrderId(tx);
      await tx.update(orders).set({ orderId: finalOrderId }).where(eq(orders.id, inserted.id));

      if (resolvedItems.length > 0) {
        const itemRows = resolvedItems.map(item => ({
          orderId: inserted.id,
          serviceId: item.serviceId,
          serviceType: data.serviceType,
          name: item.name,
          quantity: item.quantity,
          unitPrice: item.unitPrice.toString(),
          totalPrice: item.lineTotal.toString(),
        }));
        insertedItems = await tx.insert(orderItems).values(itemRows).returning();
      }

      const adjustmentRows: typeof priceAdjustments.$inferInsert[] = [];
      const appliedBy = actorName(req.auth!);
      if (data.discount && data.discount > 0 && data.discountReason) {
        adjustmentRows.push({ orderId: inserted.id, laundryId, type: "discount", amount: data.discount.toString(), reason: data.discountReason, appliedBy });
      }
      if (data.extraCharge && data.extraCharge > 0 && data.extraChargeReason) {
        adjustmentRows.push({ orderId: inserted.id, laundryId, type: "extra_charge", amount: data.extraCharge.toString(), reason: data.extraChargeReason, appliedBy });
      }
      if (adjustmentRows.length > 0) await tx.insert(priceAdjustments).values(adjustmentRows);

      return { order: { ...inserted, orderId: finalOrderId }, insertedItems, computedPrice, phoneNorm };
    });

    const { order, insertedItems, computedPrice, phoneNorm } = result;

'''
          s = s[:start] + replacement + s[end:]

          # Add explicit branchId handling to order creation schema output only;
          # branchId is consumed above and is not copied into the order payload twice.

          # Reject invalid owner discounts/charges during PATCH as well as creation.
          marker = '''    const updateData: Record<string, unknown> = { ...data, updatedAt: new Date() };'''
          insert = '''    // Financial edits must never produce a negative total due.
    if (isOwner) {
      const nextPrice = (data as any).price !== undefined ? (data as any).price : parseFloat(beforeOrder?.price || "0");
      const nextExtra = (data as any).extraCharge !== undefined ? (data as any).extraCharge : parseFloat(beforeOrder?.extraCharge || "0");
      const nextDiscount = (data as any).discount !== undefined ? (data as any).discount : parseFloat(beforeOrder?.discount || "0");
      if (nextPrice + nextExtra - nextDiscount < 0) {
        return res.status(400).json({ error: "Discount cannot exceed the order subtotal plus extra charge" });
      }
    }

    const updateData: Record<string, unknown> = { ...data, updatedAt: new Date() };'''
          # This needs beforeOrder, so insert later after beforeOrder query instead.
          assert marker in s

          # Remove paymentStatus from PATCH by rejecting it explicitly (Zod object is strict only if configured).
          marker2 = '''    const data = isOwner
      ? ownerOrderUpdateSchema.parse(req.body)
      : workerOrderUpdateSchema.parse(req.body);'''
          replacement2 = '''    if ("paymentStatus" in req.body) {
      return res.status(400).json({ error: "paymentStatus is derived from recorded payments and cannot be edited directly" });
    }

    const data = isOwner
      ? ownerOrderUpdateSchema.parse(req.body)
      : workerOrderUpdateSchema.parse(req.body);'''
          assert marker2 in s
          s = s.replace(marker2, replacement2, 1)

          # Validate financial edit after beforeOrder has been loaded.
          marker3 = '''    const [beforeOrder] = await db.select().from(orders).where(and(...patchConditions));

    // ── Status transition validation'''
          replacement3 = '''    const [beforeOrder] = await db.select().from(orders).where(and(...patchConditions));
    if (!beforeOrder) return res.status(404).json({ error: "Order not found" });

    // Owner pricing edits must preserve a non-negative total due.
    if (isOwner) {
      const nextPrice = (data as any).price !== undefined ? (data as any).price : parseFloat(beforeOrder.price || "0");
      const nextExtra = (data as any).extraCharge !== undefined ? (data as any).extraCharge : parseFloat(beforeOrder.extraCharge || "0");
      const nextDiscount = (data as any).discount !== undefined ? (data as any).discount : parseFloat(beforeOrder.discount || "0");
      if (nextPrice + nextExtra - nextDiscount < 0) {
        return res.status(400).json({ error: "Discount cannot exceed the order subtotal plus extra charge" });
      }
    }

    // ── Status transition validation'''
          assert marker3 in s
          s = s.replace(marker3, replacement3, 1)

          # Add assigned-worker tenant/branch validation before update.
          marker4 = '''    const [order] = await db.update(orders).set(updateData)
      .where(and(...patchConditions))
      .returning();'''
          replacement4 = '''    if ("assignedWorkerId" in req.body && data.assignedWorkerId !== null && data.assignedWorkerId !== undefined) {
      const [targetWorker] = await db.select({ id: workers.id, laundryId: workers.laundryId, branchId: workers.branchId })
        .from(workers).where(eq(workers.id, data.assignedWorkerId));
      if (!targetWorker || targetWorker.laundryId !== laundryId) {
        return res.status(403).json({ error: "Assigned worker does not belong to this laundry" });
      }
      if (beforeOrder.branchId !== null && targetWorker.branchId !== beforeOrder.branchId) {
        return res.status(400).json({ error: "Assigned worker must belong to the order's branch" });
      }
      if (workerBranchId && targetWorker.branchId !== workerBranchId) {
        return res.status(403).json({ error: "Workers can only assign orders to workers in their branch" });
      }
    }

    const [order] = await db.update(orders).set(updateData)
      .where(and(...patchConditions))
      .returning();'''
          assert marker4 in s
          s = s.replace(marker4, replacement4, 1)

          p.write_text(s)

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm run build

      - name: Commit hardened source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/routes/orders.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: harden order tenant boundaries and atomic creation"
          git push origin main
